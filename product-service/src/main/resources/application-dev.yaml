spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommercedb}
    username: ${POSTGRES_USER:test}
    password: ${POSTGRES_PASSWORD:test123456789}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
