spring:
  application:
    name: user-service
  profiles:
    default: dev
  config:
    # Spring does not read .env files by itself: import them as properties
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # each service owns its own schema inside the shared database
        default_schema: user_service
        hbm2ddl:
          create_namespaces: true
  grpc:
    server:
      port: ${USER_GRPC_PORT:9091}

server:
  port: ${USER_HTTP_PORT:8081}

management:
  metrics:
    tags:
      # common labels on every metric, used by the Grafana comparison dashboard
      application: ${spring.application.name}
      architecture: ${ARCHITECTURE:local}
    distribution:
      # histogram buckets so Prometheus can compute p50/p95/p99 latencies
      percentiles-histogram:
        "[http.server.requests]": true
        "[grpc.server]": true
        "[grpc.client]": true
