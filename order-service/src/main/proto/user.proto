syntax = "proto3";

package ecommerce.user;

option java_multiple_files = true;
option java_package = "com.iyedbassem.grpc.user";
option java_outer_classname = "UserProto";

// Exposed by user-service, consumed by order-service.
service UserGrpcService {
  rpc GetUser (GetUserRequest) returns (UserReply);
}

message GetUserRequest {
  int64 id = 1;
}

message UserReply {
  bool found = 1;
  int64 id = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string phone = 6;
}
