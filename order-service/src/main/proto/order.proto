syntax = "proto3";

package ecommerce.order;

option java_multiple_files = true;
option java_package = "com.iyedbassem.grpc.order";
option java_outer_classname = "OrderProto";

// Exposed by order-service.
service OrderGrpcService {
  rpc GetOrder (GetOrderRequest) returns (OrderReply);
}

message GetOrderRequest {
  int64 id = 1;
}

message OrderItemReply {
  int64 id = 1;
  int64 product_id = 2;
  int32 quantity = 3;
  string price = 4;
  string sub_total = 5;
}

message OrderReply {
  bool found = 1;
  int64 id = 2;
  int64 user_id = 3;
  string total_amount = 4;
  string status = 5;
  repeated OrderItemReply items = 6;
  string created_at = 7;
}
