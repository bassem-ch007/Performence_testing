global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # ---------------- applications ----------------
  # Docker service discovery: only RUNNING containers labelled prometheus.scrape=true
  # are scraped, so the monitoring follows the active compose profile
  # (monolith or microservices) and the stopped stack never shows up as "down".
  - job_name: spring-boot
    honor_labels: true   # keep the "application"/"architecture" tags set by the apps
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_prometheus_scrape]
        regex: "true"
        action: keep
      # one target per container: keep only the published HTTP port
      - source_labels: [__meta_docker_port_private, __meta_docker_container_label_prometheus_port]
        regex: "(8080;8080|8081;8081|8082;8082|8083;8083)"
        action: keep
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_prometheus_port]
        separator: ":"
        target_label: __address__
      - source_labels: [__meta_docker_container_label_prometheus_path]
        target_label: __metrics_path__
      # job = architecture of the running profile ("monolith" / "microservices")
      - source_labels: [__meta_docker_container_label_architecture]
        target_label: job
      - source_labels: [__meta_docker_container_label_architecture]
        target_label: architecture
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: container

  # ---------------- infrastructure ----------------
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # keep only per-container series of the containers we care about
      - source_labels: [name]
        regex: "ecommerce-mono|user-service|product-service|order-service|postgres_db"
        action: keep

  - job_name: fluent-bit
    metrics_path: /api/v2/metrics/prometheus
    static_configs:
      - targets: ["fluent-bit:2020"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
