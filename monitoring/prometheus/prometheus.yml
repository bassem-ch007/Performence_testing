global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # ---------------- applications ----------------
  # Only the stack started by the active compose profile is up;
  # the other targets are simply reported as down.
  - job_name: monolith
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ecommerce-mono:8080"]
        labels:
          architecture: monolith

  - job_name: microservices
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8081", "product-service:8082", "order-service:8083"]
        labels:
          architecture: microservices

  # ---------------- infrastructure ----------------
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # keep only per-container series of the containers we care about
      - source_labels: [name]
        regex: "ecommerce-mono|user-service|product-service|order-service|postgres_db"
        action: keep

  - job_name: fluent-bit
    metrics_path: /api/v2/metrics/prometheus
    static_configs:
      - targets: ["fluent-bit:2020"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
