[SERVICE]
    Flush           1
    Log_Level       info
    Parsers_File    parsers.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020

# Application containers ship their stdout here through Docker's "fluentd" logging driver
# (see the x-app-logging block in docker-compose.yaml).
[INPUT]
    Name            forward
    Listen          0.0.0.0
    Port            24224

# Spring Boot writes structured JSON (logstash format) in the containers:
# expand the JSON line into fields (level, logger_name, message, ...).
[FILTER]
    Name            parser
    Match           app.*
    Key_Name        log
    Parser          json
    Reserve_Data    On

# "container_name" comes as "/user-service": drop the leading slash.
[FILTER]
    Name            lua
    Match           app.*
    script          normalize.lua
    call            normalize

[OUTPUT]
    Name            loki
    Match           app.*
    Host            loki
    Port            3100
    labels          job=spring-boot, container=$container, architecture=$ARCHITECTURE, level=$level
    remove_keys     container_id, source
    line_format     json
    Retry_Limit     5
