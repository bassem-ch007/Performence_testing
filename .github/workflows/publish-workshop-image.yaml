name: Publish workshop image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Application image to build'
        type: choice
        required: true
        options:
          - monolith
          - user-service
          - product-service
          - order-service
      image_tag:
        description: 'Immutable release tag, for example 1.0.0 or 1.1.0'
        required: true
        type: string
      source_ref:
        description: 'Git branch, tag, or full commit SHA containing the application code'
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate build request
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a semver image tag such as 1.0.0 or 1.1.0"
            exit 1
          fi
          if [[ -z "$SOURCE_REF" ]]; then
            echo "::error::source_ref is required"
            exit 1
          fi
          case "$SERVICE" in
            monolith)
              echo "BUILD_CONTEXT=./ecommerceMono" >> "$GITHUB_ENV"
              echo "IMAGE_REPO=perf-monolith" >> "$GITHUB_ENV"
              ;;
            user-service|product-service|order-service)
              echo "BUILD_CONTEXT=./$SERVICE" >> "$GITHUB_ENV"
              echo "IMAGE_REPO=perf-$SERVICE" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unknown service"
              exit 1
              ;;
          esac

      - name: Check out requested application source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Record source commit
        shell: bash
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish prebuilt runtime image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: true
          platforms: linux/amd64
          tags: |
            bassem00/${{ env.IMAGE_REPO }}:${{ inputs.image_tag }}
            bassem00/${{ env.IMAGE_REPO }}:sha-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=https://github.com/bassem-ch007/Performence_testing
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Release summary
        run: |
          {
            echo "### Published Docker Hub image"
            echo "Image: bassem00/$IMAGE_REPO:${{ inputs.image_tag }}"
            echo "Source commit: $SOURCE_SHA"
            echo "This workflow builds and pushes only; it never deploys."
          } >> "$GITHUB_STEP_SUMMARY"
