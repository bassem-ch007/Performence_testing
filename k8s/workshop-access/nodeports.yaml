apiVersion: v1
kind: Service
metadata:
  name: ecommerce-mono-workshop
  namespace: staging
  labels:
    app.kubernetes.io/part-of: performance-workshop
    workshop.access: external-http
spec:
  type: NodePort
  selector:
    app: ecommerce-mono
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
