# Separate public HTTP UI endpoints for the supervised academic workshop.
# Internal monitoring ClusterIP Services and Grafana datasource URLs remain unchanged.
# Grafana requires login. Prometheus UI/API has NO authentication; remove public
# Azure NSG access when not being used, and do not publish Loki's ingestion API.
apiVersion: v1
kind: Service
metadata:
  name: grafana-workshop
  namespace: monitoring
  labels:
    workshop.access: external-http
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-workshop
  namespace: monitoring
  labels:
    workshop.access: external-http
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30090
