apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: staging
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        architecture: microservices
      annotations:
        prometheus.io/scrape: "true"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: product-service
          # Initial placeholder: must publish the image before scaling replicas above zero.
          image: ghcr.io/bassem-ch007/performance-product-service:workshop-initial
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
            - name: grpc
              containerPort: 9092
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: staging
            - name: ARCHITECTURE
              value: microservices
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: logstash
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres.data.svc.cluster.local:5432/ecommercedb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-postgres-auth
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-postgres-auth
                  key: POSTGRES_PASSWORD
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=60.0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: staging
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 8082
      targetPort: http
    - name: grpc
      port: 9092
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: product-service-grpc-headless
  namespace: staging
spec:
  clusterIP: None
  selector:
    app: product-service
  ports:
    - name: grpc
      port: 9092
      targetPort: grpc
