apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: staging
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        architecture: microservices
      annotations:
        prometheus.io/scrape: "true"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: order-service
          image: bassem00/perf-order-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
            - name: grpc
              containerPort: 9093
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: staging
            - name: ARCHITECTURE
              value: microservices
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: logstash
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres.data.svc.cluster.local:5432/ecommercedb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-postgres-auth
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-postgres-auth
                  key: POSTGRES_PASSWORD
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=60.0"
            - name: USER_GRPC_TARGET
              value: user-service:9091
            - name: PRODUCT_GRPC_TARGET
              value: product-service:9092
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: staging
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8083
      targetPort: http
    - name: grpc
      port: 9093
      targetPort: grpc
