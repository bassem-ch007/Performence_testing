apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    isDefault: true
    url: http://prometheus.monitoring.svc.cluster.local:9090
    jsonData:
      timeInterval: 5s
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki.monitoring.svc.cluster.local:3100
  - name: JMeter InfluxDB
    uid: jmeter-influx
    type: influxdb
    access: proxy
    url: http://influxdb.monitoring.svc.cluster.local:8086
    database: jmeter
    jsonData:
      version: InfluxQL
      httpMode: GET
