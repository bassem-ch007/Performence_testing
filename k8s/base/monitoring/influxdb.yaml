apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: monitoring
spec:
  selector: {app: influxdb}
  ports:
    - {name: http, port: 8086, targetPort: http}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: monitoring
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: influxdb}
  template:
    metadata:
      labels: {app: influxdb}
    spec:
      containers:
        - name: influxdb
          image: influxdb:1.8
          ports: [{name: http, containerPort: 8086}]
          env:
            - {name: INFLUXDB_DB, value: jmeter}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 150m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/influxdb}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: influxdb-data}
