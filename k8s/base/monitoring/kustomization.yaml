apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - prometheus.yml
  - name: grafana-datasources
    namespace: monitoring
    files:
      - datasources.yaml
generatorOptions:
  disableNameSuffixHash: true
