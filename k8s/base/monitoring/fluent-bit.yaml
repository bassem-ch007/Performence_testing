apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-fluent-bit-reader
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-fluent-bit-reader
roleRef:
  kind: ClusterRole
  name: workshop-fluent-bit-reader
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: monitoring
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: monitoring
spec:
  selector:
    matchLabels: {app: fluent-bit}
  template:
    metadata:
      labels: {app: fluent-bit}
    spec:
      serviceAccountName: fluent-bit
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:4.0.5
          args: ["-c", "/fluent-bit/config/fluent-bit.conf"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 100m, memory: 192Mi}
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/config, readOnly: true}
            - {name: logs, mountPath: /var/log, readOnly: true}
            - {name: state, mountPath: /fluent-bit/state}
      volumes:
        - name: config
          configMap: {name: fluent-bit-config}
        - name: logs
          hostPath: {path: /var/log, type: Directory}
        - name: state
          emptyDir: {}
