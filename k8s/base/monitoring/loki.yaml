apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
spec:
  selector: {app: loki}
  ports:
    - {name: http, port: 3100, targetPort: http}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      securityContext: {fsGroup: 10001}
      containers:
        - name: loki
          image: grafana/loki:3.5.3
          args: ["-config.file=/etc/loki/config.yaml"]
          ports: [{name: http, containerPort: 3100}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 150m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - {name: config, mountPath: /etc/loki, readOnly: true}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap:
            name: loki-config
            items:
              - {key: loki-config.yaml, path: config.yaml}
        - name: data
          persistentVolumeClaim: {claimName: loki-data}
